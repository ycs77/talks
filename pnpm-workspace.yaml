catalogMode: prefer
shamefullyHoist: true
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - undici-types@6.21.0

packages:
  - '*/src'

catalog:
  '@slidev/cli': ^52.11.3
  '@slidev/client': ^52.11.3
  '@slidev/theme-default': ^0.25.0
  '@slidev/theme-seriph': ^0.25.0
  '@types/node': ^24.13.1
  '@ycs77/eslint-config': ^9.0.0
  eslint: ^10.4.1
  find-up: ^8.0.0
  playwright-chromium: ^1.60.0
  rimraf: ^6.1.3
  tinyexec: ^1.2.4
  tsx: ^4.22.4
  typescript: ^6.0.3
  vue-tsc: ^3.3.3

allowBuilds:
  esbuild: true
  playwright-chromium: true
